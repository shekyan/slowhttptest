# A local nginx for exercising slowhttptest-ng against a real HTTP/2 stack.
#
# Purpose, in order of value:
#
#   1. Prove the HTTP/2 framing is correct. Until now it has only been checked
#      against a validator written alongside the encoder, which cannot catch a
#      misreading shared by both. nginx either parses our frames or sends
#      GOAWAY/PROTOCOL_ERROR, and that is a real answer.
#   2. Give slow read something worth buffering, via a large response body.
#   3. Show what a *mitigated* server looks like under rapid reset. nginx has
#      counted resets and closed the connection since 1.25.3, which arrives in
#      the tool as peer_closed -- so a rising peer_closed count is the tool
#      correctly detecting a patched server, not a failure.
#
# Cleartext h2c is deliberate: it isolates framing from TLS, so a framing bug
# cannot hide behind a handshake problem. The TLS server block is there for
# testing ALPN separately, and needs a certificate (see the header of
# tools/nginx-h2-testbed.sh).
#
#   nginx -p /tmp/ng-nginx -c nginx.conf         # start
#   nginx -p /tmp/ng-nginx -c nginx.conf -s quit # stop
#
# Requires nginx >= 1.25.1 for the `http2 on;` directive, which is what enables
# h2c prior knowledge on a plain listener. Older builds only take `http2` as a
# `listen` parameter and only alongside `ssl`.

worker_processes 1;
# One worker on purpose. Saturation is the thing being measured, and spreading
# connections over eight of them makes the ceiling eight times further away and
# eight times harder to reason about.

error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 512;
    # Deliberately small. The default of 1024 per worker is high enough that a
    # laptop runs out of ephemeral ports before nginx runs out of connections,
    # so the run would measure the client rather than the server.
}

http {
    access_log off;
    # Off, or the disk write per request becomes the bottleneck and every
    # measurement describes the log rather than the server.

    default_type application/octet-stream;
    sendfile on;

    # Generous, so that a stall is the client's doing rather than a timeout
    # firing. Tighten these later to see mitigation work: this is the
    # "vulnerable" posture.
    client_body_timeout   300s;
    client_header_timeout 300s;
    send_timeout          300s;
    keepalive_timeout     300s;

    http2_max_concurrent_streams 128;
    # The limit rapid reset defeats: cancelled streams stop counting against it
    # while their work continues. Left at the default so the behaviour is the
    # one people actually run.

    server {
        listen 8080;
        http2 on;          # h2c prior knowledge, nginx >= 1.25.1
        server_name localhost;
        root html;

        # Slow read needs a response large enough that the server has to hold
        # it. A 64 MB file will not fit in socket buffers, so with the HTTP/2
        # window opened wide and the TCP window starved, nginx has to keep it
        # somewhere -- which is the whole point of CVE-2019-9517.
        location /big {
            alias html/big.bin;
        }

        location / {
            return 200 "ng h2 testbed\n";
        }
    }

    # ALPN, separately. Only useful once a certificate exists; see the script.
    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;
        ssl_certificate     cert.pem;
        ssl_certificate_key key.pem;
        root html;

        location /big {
            alias html/big.bin;
        }
        location / {
            return 200 "ng h2 testbed (tls)\n";
        }
    }
}
