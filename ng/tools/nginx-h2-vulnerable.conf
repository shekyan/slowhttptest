# A deliberately weakened nginx, to show what slow read over HTTP/2 actually
# threatens. Do not copy this into production; every setting below is chosen to
# remove a defence.
#
# The point it demonstrates:
#
# nginx on its own is a poor target. It is event driven, a held connection costs
# it almost nothing, and its HTTP/2 buffering is bounded -- which is why the
# straightforward attack against the static testbed reports SERVICE HELD, and
# correctly so. The interesting target is the application behind it.
#
# With proxy_buffering off, nginx becomes a pass-through: it reads from the
# upstream only as fast as the client accepts, so a client that refuses to read
# pins the upstream connection, and with it one worker in the backend. That is
# the ordinary slow-read attack, except for one thing -- HTTP/2 multiplexing
# means a single TCP connection can carry a hundred of those at once. Per-IP
# connection limits, the standard Slowloris mitigation, see one connection.
#
# The opposite setting is not safe either, only differently unsafe. With
# proxy_buffering on, nginx drains the upstream as fast as it can and holds the
# response itself -- in proxy_buffers, then in a temp file on disk, up to
# proxy_max_temp_file_size, which defaults to 1024m. Per stalled request. That
# is CVE-2019-9517 proper, and the cost lands on nginx rather than the backend.
#
#   upstream must be listening on 127.0.0.1:9910
#   nginx -p /tmp/ng-nginx-vuln -c nginx.conf

worker_processes 1;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    default_type application/octet-stream;

    upstream backend {
        server 127.0.0.1:9910;
        # No keepalive pool: every proxied request takes its own upstream
        # connection, so pinned requests map one-to-one onto backend workers.
        keepalive 0;
    }

    server {
        listen 8081;
        http2 on;
        server_name localhost;

        # No cap on concurrent streams beyond the default 128, so one client
        # connection can hold many upstream connections at once. This is the
        # multiplexing amplification: connections look unremarkable, the work
        # behind them does not.
        http2_max_concurrent_streams 128;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # The setting that matters. Off means nginx does not decouple the
            # upstream from the client, so the client's read rate becomes the
            # backend's write rate.
            proxy_buffering off;

            # Generous, so that what gives way is a resource limit rather than a
            # timeout. Timeouts are the real defence here and this removes them
            # on purpose; see the notes at the end of the file.
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
            proxy_connect_timeout 10s;
            send_timeout          300s;
        }
    }
}

# What to put back, in the order that helps most:
#
#   send_timeout 10s;          caps how long a client may take to accept data;
#                              this is the direct answer to slow read
#   proxy_buffering on;        decouples the backend from the client, so a slow
#                              client stops being the backend's problem
#   proxy_max_temp_file_size   bound it, or buffering trades a pinned worker for
#                              a gigabyte of disk per stalled request
#   http2_max_concurrent_streams
#                              lower it; this is the multiplier
#   limit_conn                 per-IP connection limits still help, but note
#                              they count connections and this attack needs one
