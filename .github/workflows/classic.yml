# SPDX-License-Identifier: Apache-2.0
# CI for the classic autotools tool in src/. The C++17 rewrite is covered by
# ng.yml.
#
# This did not exist until now. ng.yml is path-filtered to ng/, so a change to
# src/ ran no build at all, and the only thing compiling the classic tree was
# the CodeQL scan -- which runs on master and a weekly cron, and is a security
# analysis rather than a build-and-test gate. The Travis badge that used to
# stand in for this had been dead since 2021.
name: classic

on:
  push:
    paths:
      - 'src/**'
      - 'man/slowhttptest.1'
      - 'configure.ac'
      - 'configure'
      - 'Makefile.am'
      - 'Makefile.in'
      - 'm4/**'
      - 'aclocal.m4'
      - 'config.h.in'
      - '.github/workflows/classic.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'man/slowhttptest.1'
      - 'configure.ac'
      - 'configure'
      - 'Makefile.am'
      - 'Makefile.in'
      - 'm4/**'
      - 'aclocal.m4'
      - 'config.h.in'
      - '.github/workflows/classic.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Ubuntu runners ship the dev package; macOS needs Homebrew's keg, which
      # configure now locates by itself -- that discovery is the thing most
      # worth exercising here, since hardcoded Intel paths made ./configure fail
      # outright on Apple Silicon until 1.10.0.
      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      # Printed for the log, not asserted. VERSION reaches the binary through
      # config.h, which config.status generates from AC_INIT in the same run --
      # so comparing the two would compare a value against itself.
      - name: Show the version under test
        # `-h` exits 1 and `head` closes the pipe early, either of which trips
        # the `-eo pipefail` Actions runs this with. Nothing here is an
        # assertion -- it exists to put the version in the log.
        run: ./src/slowhttptest -h 2>&1 | head -3 || true

      # A compile check alone would not have caught the things people actually
      # report. This runs a short test against a local server and requires the
      # reports to appear, with stdout redirected the way CI always has it.
      - name: Smoke test against a local server
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          ./src/slowhttptest -c 10 -H -r 20 -l 5 -x 3 -p 2 \
              -u http://127.0.0.1:8099/ -g -o "$RUNNER_TEMP/report" \
              > "$RUNNER_TEMP/run.log" 2>&1 && rc=0 || rc=$?
          cat "$RUNNER_TEMP/run.log"
          test $rc -eq 0 || { echo "exited $rc"; exit 1; }
          test -s "$RUNNER_TEMP/report.csv"  || { echo "no CSV report"; exit 1; }
          test -s "$RUNNER_TEMP/report.html" || { echo "no HTML report"; exit 1; }

      # Guards the whole truncation/overflow class. An over-long option value
      # must be refused with a message, never silently cut and never a crash:
      # a truncated Cookie makes the tool authenticate as nobody and attack the
      # unauthenticated path while the report claims the request went as asked.
      # A long -o is called out separately because it reaches a fixed
      # report-filename buffer rather than a header buffer.
      #
      # The error text is asserted, not just the exit status: with no server
      # listening the tool also exits non-zero, so a status-only check would
      # pass even if the value had been quietly truncated.
      - name: Over-long option values are refused, not truncated
        run: |
          set -u
          fail=0
          refuses() {  # flag, value, label
            # Actions runs this with `bash -eo pipefail`, where a failing
            # command substitution in an assignment aborts the step before the
            # status can be inspected -- and refusing is a non-zero exit, which
            # is exactly what this step is here to observe.
            out=$(./src/slowhttptest -H -l 1 -c 1 -"$1" "$2" \
                    -u http://127.0.0.1:8099/ 2>&1) && rc=0 || rc=$?
            case $rc in
              134|139)
                echo "FAIL: -$1 crashed (rc=$rc) on $3"; fail=1 ;;
              *)
                if echo "$out" | grep -q "value is .* bytes, max:"; then
                  echo "ok: -$1 refused $3"
                else
                  echo "FAIL: -$1 did not refuse $3 (rc=$rc)"; fail=1
                fi ;;
            esac
          }
          big() { python3 -c "print('x'*$1)"; }
          refuses j "$(big 9000)"  "a 9000-byte cookie"
          refuses 1 "X-T: $(big 9000)" "a 9000-byte header"
          refuses m "$(big 9000)"  "a 9000-byte Accept"
          refuses f "$(big 9000)"  "a 9000-byte Content-Type"
          refuses t "$(big 40)"    "a 40-byte verb"
          refuses o "$(big 5000)"  "a 5000-byte report base"
          test $fail -eq 0 || exit 1

      # The other half: a value that fits must go out whole. 1 KB used to be the
      # ceiling, which a JWT cookie exceeds.
      - name: Header values under the limit are sent intact
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          ./src/slowhttptest -H -l 4 -c 2 -i 2 \
            -j "$(python3 -c "print('J'*2000)")" \
            -u http://127.0.0.1:8099/ >/dev/null 2>&1 \
            || { echo "a 2000-byte cookie was rejected"; exit 1; }
          ./src/slowhttptest -H -l 4 -c 2 -i 2 -g -o "$RUNNER_TEMP/len" \
            -u http://127.0.0.1:8099/ >/dev/null 2>&1 || true
          test -s "$RUNNER_TEMP/len.csv" || { echo "-o regressed"; exit 1; }

      # Distro packaging is why this tool is still autotools, so the install has
      # to keep working -- DESTDIR included, which every packaging system uses.
      - name: Install into a staging root
        run: |
          make install DESTDIR="$PWD/stage"
          test -x stage/usr/local/bin/slowhttptest
          test -f stage/usr/local/share/man/man1/slowhttptest.1
