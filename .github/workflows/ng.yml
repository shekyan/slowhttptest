# SPDX-License-Identifier: Apache-2.0
# CI for the ng/ C++17 rewrite. The classic autotools build is covered by classic.yml.
name: ng

on:
  push:
    paths: ['ng/**', '.github/workflows/ng.yml']
  pull_request:
    paths: ['ng/**', '.github/workflows/ng.yml']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both standard libraries matter: libstdc++ (GCC) and libc++ (Clang/macOS)
        # differ in which headers they pull in transitively, which is exactly how
        # a missing #include slips through on one platform and breaks the other.
        #
        # timeout_scale widens the end-to-end budgets on runners measured to be
        # slower. Only macOS is: 626s for the suite against 458s on Linux, 1.37x.
        # The Linux jobs, sanitizers included, run it in the same 458-463s and
        # get no scale at all.
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            timeout_scale: 1
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            timeout_scale: 1
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            timeout_scale: 2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # OpenSSL is the only mandatory dependency. Ubuntu runners ship the dev
      # package; macOS needs the Homebrew keg pointed at explicitly, because the
      # system only provides LibreSSL headers-free.
      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S ng -B ng/build -DCMAKE_BUILD_TYPE=Release
          -DSLOWHTTP_TEST_TIMEOUT_SCALE=${{ matrix.timeout_scale }}

      - name: Build
        run: cmake --build ng/build -j

      - name: Test
        run: ctest --test-dir ng/build --output-on-failure

      # Distro packaging is the reason this is C++ rather than Rust, so the
      # install has to keep working -- including DESTDIR, which every packaging
      # system relies on and which is easy to break without noticing.
      - name: Install into a staging root
        run: |
          DESTDIR="$PWD/stage" cmake --install ng/build --prefix /usr/local
          test -x stage/usr/local/bin/slowhttptest-ng
          test -f stage/usr/local/share/man/man1/slowhttptest-ng.1
          stage/usr/local/bin/slowhttptest-ng -V

  # The TLS-less build is a supported configuration, so it has to keep compiling
  # and keep refusing https with an explanation rather than failing to link.
  no-tls:
    name: ubuntu / without TLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Configure without TLS
        run: cmake -S ng -B ng/build-notls -DCMAKE_BUILD_TYPE=Release -DSLOWHTTP_TLS=OFF

      - name: Build
        run: cmake --build ng/build-notls -j

      - name: Test
        run: ctest --test-dir ng/build-notls --output-on-failure

      - name: https must be refused with an explanation
        run: |
          set +e
          out=$(./ng/build-notls/slowhttptest-ng -u https://127.0.0.1:1/ -l 1 --no-probe 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -ne 0 || { echo "expected a non-zero exit"; exit 1; }
          echo "$out" | grep -q "no TLS backend" || { echo "expected a clear message"; exit 1; }

  sanitizers:
    name: ubuntu / asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # No timeout scale here, deliberately. This job used to widen the budgets
      # on the theory that instrumentation stretches the end-to-end waits; the
      # first green run disproved it, at 463s against plain gcc's 458s. ASan
      # slows CPU work, and these suites are almost entirely sleeps.
      - name: Configure with sanitizers
        run: >
          cmake -S ng -B ng/build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build ng/build-asan -j

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir ng/build-asan --output-on-failure
